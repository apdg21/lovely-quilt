<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧵 Lovely Quilt · Email Health Dashboard</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            background: #faf7f2;
            color: #2c2418;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        .kpi-card {
            background: white;
            padding: 1.2rem;
            border-radius: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
        }
        .kpi-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #b1622c;
        }
        .kpi-label {
            font-size: 0.8rem;
            color: #6b4f32;
            text-transform: uppercase;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin: 1.5rem 0;
        }
        th, td {
            padding: 0.75rem;
            text-align: right;
            border-bottom: 1px solid #eee;
        }
        th:first-child, td:first-child {
            text-align: left;
            font-weight: 600;
        }
        th {
            background: #f5ede3;
            color: #4a3729;
        }
        .warning {
            background: #fff3e0;
            padding: 1rem;
            border-radius: 0.75rem;
            margin: 1rem 0;
        }
        h1 {
            color: #4a3729;
        }
        .last-updated {
            font-size: 0.75rem;
            color: #9b846b;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <h1>🧵 Lovely Quilt · Email Health Dashboard</h1>
    <div id="kpiContainer" class="kpi-grid">Loading data...</div>
    <div id="tableContainer">Loading table...</div>
    <div class="last-updated" id="lastUpdated"></div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('/data.json?t=' + Date.now());
                const data = await response.json();
                const monthly = data.monthly;
                const historical = monthly.historicalData;

                // Update KPIs
                document.getElementById('kpiContainer').innerHTML = `
                    <div class="kpi-card">
                        <div class="kpi-value">$${monthly.latestOmnisend.toLocaleString()}</div>
                        <div class="kpi-label">Latest Omnisend</div>
                        <small>${monthly.latestOmnisendMoM}% MoM</small>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-value">${monthly.newSubscribers.toLocaleString()}</div>
                        <div class="kpi-label">New Subs (latest)</div>
                        <small>Avg 3m: ${monthly.avg3mNewSubs}</small>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-value">${monthly.unsubRate}%</div>
                        <div class="kpi-label">Unsub Rate (latest)</div>
                        <small>Avg 3m: ${monthly.avg3mUnsubRate}%</small>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-value">${monthly.engagedList.toLocaleString()}</div>
                        <div class="kpi-label">Engaged List</div>
                        <small>Target: ${monthly.targetEngaged.toLocaleString()}</small>
                    </div>
                `;

                // Build table
                let tableHtml = `
                    <table>
                        <thead>
                            <tr><th>Month</th><th>🆕 New Subs</th><th>🚫 Unsubs</th><th>📈 Net Growth</th><th>👥 Engaged</th><th>📧 Campaigns $</th><th>⚙️ Auto $</th><th>📬 Omnisend $</th><th>🏪 Store $</th><th>⚠️ Unsub Rate</th></tr>
                        </thead>
                        <tbody>
                `;

                for (const row of historical) {
                    tableHtml += `
                        <tr>
                            <td>${row.month}</td>
                            <td>${row.newSubs.toLocaleString()}</td>
                            <td>${row.unsubs.toLocaleString()}</td>
                            <td>${row.netGrowth >= 0 ? '+' : ''}${row.netGrowth}</td>
                            <td>${row.engaged.toLocaleString()}</td>
                            <td>$${row.campaignsRevenue.toFixed(2)}</td>
                            <td>$${row.autoRevenue.toFixed(2)}</td>
                            <td>$${row.omnisendRevenue.toFixed(2)}</td>
                            <td>$${row.storeRevenue.toFixed(2)}</td>
                            <td>${row.unsubRate}%</td>
                        </tr>
                    `;
                }

                tableHtml += `</tbody></table>`;
                document.getElementById('tableContainer').innerHTML = tableHtml;

                const now = new Date();
                document.getElementById('lastUpdated').innerHTML = `📅 Last updated: ${now.toLocaleString()} · Data from data.json`;

            } catch (err) {
                console.error('Error loading data:', err);
                document.getElementById('kpiContainer').innerHTML = '<div class="warning">⚠️ Could not load data.json. Make sure the file exists at /data.json</div>';
            }
        }

        loadData();
        // Auto-refresh every 5 minutes
        setInterval(loadData, 5 * 60 * 1000);
    </script>

    <!-- ── FLOATING HOME BUTTON ── -->
<style>
  .home-fab {
    position: fixed;
    top: 1.75rem;
    right: 1.75rem;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    cursor: pointer;
  }
  .home-fab-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2c1e14, #5c3d28);
    box-shadow: 0 4px 18px rgba(44,30,20,0.35), 0 1px 4px rgba(44,30,20,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    transition: transform 0.22s, box-shadow 0.22s, background 0.22s;
    border: 1.5px solid rgba(232,221,208,0.15);
  }
  .home-fab:hover .home-fab-btn {
    transform: translateY(-3px) scale(1.07);
    box-shadow: 0 8px 28px rgba(44,30,20,0.4), 0 2px 6px rgba(44,30,20,0.2);
    background: linear-gradient(135deg, #3e2718, #7a5236);
  }
  .home-fab-label {
    font-family: 'DM Sans', 'Inter', system-ui, sans-serif;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #5c3d28;
    background: rgba(255,252,247,0.92);
    padding: 0.18rem 0.55rem;
    border-radius: 100px;
    border: 1px solid rgba(180,145,115,0.25);
    box-shadow: 0 2px 8px rgba(44,30,20,0.08);
    white-space: nowrap;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .home-fab:hover .home-fab-label {
    opacity: 1;
    transform: translateY(0);
  }
</style>
<a class="home-fab" href="/reports.html" title="Back to Home">
  <div class="home-fab-btn">🏚️</div>
  <span class="home-fab-label">Home</span>
</a>
</body>
</html>
