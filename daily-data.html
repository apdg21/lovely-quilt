<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧵 Lovely Quilt · daily campaign pulse</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            background: #faf7f2;
            color: #2c2418;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        .kpi-card {
            background: white;
            padding: 1.2rem;
            border-radius: 1rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .kpi-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #b1622c;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 1rem;
            overflow-x: auto;
            display: block;
            margin: 1.5rem 0;
        }
        th, td {
            padding: 0.75rem;
            text-align: right;
            border-bottom: 1px solid #eee;
        }
        th:first-child, td:first-child {
            text-align: left;
        }
        th {
            background: #f5ede3;
        }
        h1 {
            color: #4a3729;
        }
        .last-updated {
            font-size: 0.75rem;
            color: #9b846b;
            margin-top: 1rem;
        }
        .json-editor {
            background: #2c2418;
            color: #e5d5bf;
            padding: 1rem;
            border-radius: 0.75rem;
            font-family: monospace;
            font-size: 0.8rem;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <h1>🧵 Lovely Quilt · daily campaign pulse</h1>
    <div id="kpiContainer" class="kpi-grid">Loading data...</div>
    <div id="tableContainer">Loading campaigns...</div>
    <div class="last-updated" id="lastUpdated"></div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('/data.json?t=' + Date.now());
                const data = await response.json();
                const daily = data.daily;

                // Update KPIs
                document.getElementById('kpiContainer').innerHTML = `
                    <div class="kpi-card">
                        <div class="kpi-value">${daily.totalSends.toLocaleString()}</div>
                        <div class="kpi-label">Total sends</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-value">$${daily.totalRevenue.toFixed(2)}</div>
                        <div class="kpi-label">Total revenue</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-value">${daily.avgOpenRate}%</div>
                        <div class="kpi-label">Avg open rate</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-value">${daily.avgClickRate}%</div>
                        <div class="kpi-label">Avg click rate</div>
                    </div>
                `;

                // Build campaign table
                let tableHtml = `
                    <table>
                        <thead>
                            <tr><th>Campaign name</th><th>Date & time</th><th>Sent</th><th>Open rate</th><th>Opens</th><th>Click rate</th><th>Clicks</th><th>Revenue</th><th>Orders</th></tr>
                        </thead>
                        <tbody>
                `;

                for (const campaign of daily.campaigns) {
                    tableHtml += `
                        <tr>
                            <td>${campaign.name}</td>
                            <td>${campaign.dateTime}</td>
                            <td>${campaign.sent.toLocaleString()}</td>
                            <td>${campaign.openRate}%</td>
                            <td>${campaign.opens.toLocaleString()}</td>
                            <td>${campaign.clickRate}%</td>
                            <td>${campaign.clicks.toLocaleString()}</td>
                            <td>$${campaign.revenue.toFixed(2)}</td>
                            <td>${campaign.orders}</td>
                        </tr>
                    `;
                }

                tableHtml += `</tbody></table>`;
                document.getElementById('tableContainer').innerHTML = tableHtml;

                const now = new Date();
                document.getElementById('lastUpdated').innerHTML = `📅 Last updated: ${now.toLocaleString()} · Data from data.json · Period: ${daily.period}`;

            } catch (err) {
                console.error('Error loading data:', err);
                document.getElementById('kpiContainer').innerHTML = '<div style="background:#fff0e6;padding:1rem;border-radius:1rem;">⚠️ Could not load data.json. Make sure the file exists at /data.json</div>';
            }
        }

        loadData();
        setInterval(loadData, 5 * 60 * 1000);
    </script>

    <!-- ── FLOATING HOME BUTTON ── -->
<style>
  .home-fab {
    position: fixed;
    top: 1.75rem;
    right: 1.75rem;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    cursor: pointer;
  }
  .home-fab-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2c1e14, #5c3d28);
    box-shadow: 0 4px 18px rgba(44,30,20,0.35), 0 1px 4px rgba(44,30,20,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    transition: transform 0.22s, box-shadow 0.22s, background 0.22s;
    border: 1.5px solid rgba(232,221,208,0.15);
  }
  .home-fab:hover .home-fab-btn {
    transform: translateY(-3px) scale(1.07);
    box-shadow: 0 8px 28px rgba(44,30,20,0.4), 0 2px 6px rgba(44,30,20,0.2);
    background: linear-gradient(135deg, #3e2718, #7a5236);
  }
  .home-fab-label {
    font-family: 'DM Sans', 'Inter', system-ui, sans-serif;
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #5c3d28;
    background: rgba(255,252,247,0.92);
    padding: 0.18rem 0.55rem;
    border-radius: 100px;
    border: 1px solid rgba(180,145,115,0.25);
    box-shadow: 0 2px 8px rgba(44,30,20,0.08);
    white-space: nowrap;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .home-fab:hover .home-fab-label {
    opacity: 1;
    transform: translateY(0);
  }
</style>
<a class="home-fab" href="/reports.html" title="Back to Home">
  <div class="home-fab-btn">🏚️</div>
  <span class="home-fab-label">Home</span>
</a>
</body>
</html>
